[project]
name = 'wtmpl'
dynamic = [
	'version',
]
description = 'An easier to use directory templating tool. Inspired by itmpl.'
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"arguably>=1.3.0",
	# "kdl-py>=1.2.0",
	"gitignore-parser>=0.1.13",
	"nya-scope>=0.2.1",
	"platformdirs>=4.9.1",
	# "pydantic>=2.12.5",
	"rich>=14.3.2",
	# "rich @ git+https://github.com/Textualize/rich@master" # try to fix the tab-indent wrong highlight in traceback but still doesnt work...?
]

[project.scripts]
wtmpl = "wtmpl.__main__:main"

[build-system]
requires = [
	"hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wtmpl/_version.py"
pattern = '__version__(?:: str)? *= *\"(?P<version>[^\"]+)\"'

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
	"tcrutils>=13.1.39",
]
