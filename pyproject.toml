[project]
name = 'wtmpl'
dynamic = ['version']
description = 'An easier to use directory templating tool. Inspired by itmpl.'
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arguably>=1.3.0",
    # "kdl-py>=1.2.0",
    "platformdirs>=4.5.1",
    # "pydantic>=2.12.5",
    "rich>=14.3.1",
]

[project.scripts]
wtmpl = "wtmpl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wtmpl/_version.py"
pattern = '__version__(?:: str)? *= *\"(?P<version>[^\"]+)\"'
